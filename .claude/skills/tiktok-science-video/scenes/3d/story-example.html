<!doctype html><html><head><meta charset="utf-8"><title>story example</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
// Example story shot built with the story kit: Mars Climate Orbiter, Sept. 23, 1999.
// A stylized orbiter swings toward Mars. The planned path (green) stays high; the real path (red) dips into the
// atmosphere, the craft glows, flashes and breaks apart. Copy this file next to a script to start a new story shot.
// PARAMS: duration (set by motion.js), year ('1999'), sub ('Mars Climate Orbiter')
import { P } from '/scenes/common.js';
import { story, PALETTE, THREE } from '/scenes/story-kit.js';
const D = P.duration || 6;
const k = await story({ sky: ['#2b1055', '#05030f'], bloom: 0.9 });
k.add(k.stars(700));

// Mars with a glowing atmosphere shell.
const mars = k.add(k.planet({ color: PALETTE.mars, radius: 1.5, spots: 10, spotColor: '#b23a1f' }), [0, -1.2, 0]);
const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.75, 48, 32), new THREE.MeshBasicMaterial({ color: new THREE.Color('#ff9f6b'), transparent: true, opacity: 0.18 }));
mars.add(atmo);
k.every((t) => { mars.userData.ball.rotation.y = t * 0.15; });

// Orbiter: gold box body plus a blue solar panel.
const craft = new THREE.Group();
craft.add(k.box({ size: [0.35, 0.35, 0.35], color: PALETTE.sun }));
const panel = k.box({ size: [1.0, 0.03, 0.32], color: '#3a5bd9', radius: 0.01 });
panel.position.x = 0.65; craft.add(panel);
k.add(craft);

// Paths: planned (high, green) and actual (low, red), as arcs around Mars.
const arc = (radius, from, to) => new THREE.CatmullRomCurve3(Array.from({ length: 40 }, (_, i) => {
  const a = from + (to - from) * (i / 39);
  return new THREE.Vector3(Math.cos(a) * radius, -1.2 + Math.sin(a) * radius * 0.35, Math.sin(a) * radius * 0.6);
}));
const planned = arc(3.0, 2.6, 0.4);
const actual = new THREE.CatmullRomCurve3(Array.from({ length: 40 }, (_, i) => {
  const a = 2.6 - 2.2 * (i / 39), rad = 3.0 - 1.05 * Math.min(1, (i / 39) * 1.3);
  return new THREE.Vector3(Math.cos(a) * rad, -1.2 + Math.sin(a) * rad * 0.35, Math.sin(a) * rad * 0.6);
}));
const line = (curve, color) => new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.035, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(color) }));
k.show(k.add(line(planned, PALETTE.mint)), 0.6);
k.show(k.add(line(actual, PALETTE.coral)), 1.4);
const lp = k.add(k.label('PLANNED', { color: PALETTE.mint, size: 0.42 }), planned.getPoint(0.15).toArray());
lp.position.y += 0.55; k.show(lp, 0.7, D * 0.55);
const la = k.add(k.label('ACTUAL', { color: PALETTE.coral, size: 0.42 }), actual.getPoint(0.6).toArray());
la.position.y -= 0.5; k.show(la, 1.5, D * 0.75);

const hit = D * 0.72;
k.every((t) => {
  const u = Math.min(1, Math.max(0, (t - 0.3) / (hit - 0.3)));
  craft.position.copy(actual.getPoint(u));
  craft.rotation.set(t * 0.6, t * 1.1, 0.3);
  craft.visible = t < hit;
  const heat = Math.max(0, (u - 0.75) / 0.25);
  craft.children[0].material.emissive = new THREE.Color('#ff3b1f');
  craft.children[0].material.emissiveIntensity = heat * 3;
  atmo.material.opacity = 0.18 + heat * 0.25;
});
k.flash(hit);
k.burst(actual.getPoint(1).toArray(), hit, { count: 140, speed: 2.5 });
k.shake(hit, hit + 0.6, 0.12);
k.camera([[0, { pos: [0, 3, 17], look: [0, -1, 0] }], [hit, { pos: [3, 1.5, 13], look: [0.3, -1, 0] }], [D, { pos: [3.4, 1.2, 12], look: [0.3, -1, 0] }]]);
k.badge(P.year || '1999', 0.15, P.sub || 'Mars Climate Orbiter');
k.done();
</script></body></html>
