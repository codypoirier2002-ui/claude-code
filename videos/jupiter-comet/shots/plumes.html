<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script></head><body><script type="module">
import { P } from "/scenes/common.js";
import { story, PALETTE, THREE, jupiter, fragment } from "/base/shots/jup.js";
const D = P.duration || 6;
const sky = ["#1a0b3d", "#05030f"];
// Plumes up to 3,000 km high, side view of Jupiter's limb.
const k = await story({ fov: 62, sky: ["#3a0f1e", "#04020a"], bloom: 1.2 });
k.add(k.stars(400));
const R = 7;
const J = k.add(jupiter(k, R), [0, -R - 2.6, 0]);
J.rotation.y = 0.4;
const T0 = 0.6;
const plumes = [];
[-1.6, 0, 1.4].map((x) => x).forEach((x, idx) => {
  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.5, 1, 16), new THREE.MeshBasicMaterial({ color: "#ff8a3d", transparent: true, opacity: 0.8 }));
  stem.position.y = 0.5; g.add(stem);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.9, 20, 14), new THREE.MeshBasicMaterial({ color: "#ffd166", transparent: true, opacity: 0.9 }));
  cap.scale.y = 0.55; g.add(cap);
  g.position.set(x, -1.2, 0.2);
  k.add(g); plumes.push({ g, stem, cap, h: idx === 1 ? 6.2 : 4.4 - idx * 0.6, t0: T0 + idx * 0.45 });
});
k.every((t) => plumes.forEach(({ g, stem, cap, h, t0 }) => {
  const u = Math.min(1, Math.max(0, (t - t0) / 1.6)), e = 1 - (1 - u) ** 3;
  g.visible = t >= t0; stem.scale.y = Math.max(0.01, h * e); stem.position.y = stem.scale.y / 2;
  cap.position.y = stem.scale.y; cap.scale.setScalar(0.4 + 1.3 * e); cap.scale.y *= 0.6;
  cap.material.opacity = 0.9 - 0.3 * Math.max(0, (t - t0 - 2) / 3);
}));
k.burst([0, -1.2, 0.3], T0, { count: 120, speed: 4, life: 1.8 });
k.flash(T0, 0.3); k.shake(T0, T0 + 0.9, 0.14);
const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.06, 7, 0.06), new THREE.MeshBasicMaterial({ color: PALETTE.sky }));
k.add(bracket, [4, 2.3, 0]); k.show(bracket, 2.2);
const l1 = k.add(k.label("UP TO 3,000 km", { color: PALETTE.sky, size: 0.9 }), [2.6, 6.3, 0]); k.show(l1, 2.3);
const l2 = k.add(k.label("= 300 MILLION ATOMIC BOMBS", { color: PALETTE.coral, size: 0.75 }), [0, 7.6, 0]); k.show(l2, 3.8);
k.camera([[0, { pos: [0, 1.5, 17], look: [0, 1.5, 0] }], [D, { pos: [0, 3, 14.5], look: [0.5, 2.8, 0] }]]);
k.badge("1994", 0.15, "Impact plumes");
k.done();
</script></body></html>
