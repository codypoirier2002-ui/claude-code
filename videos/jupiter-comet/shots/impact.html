<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script></head><body><script type="module">
import { P } from "/scenes/common.js";
import { story, PALETTE, THREE, jupiter, fragment } from "/base/shots/jup.js";
const D = P.duration || 6;
const sky = ["#1a0b3d", "#05030f"];
// July 16-22, 1994: the fragments hit one after another. Galileo (en route to Jupiter) watched.
const k = await story({ fov: 62, sky: ["#2a0b2e", "#04020a"], bloom: 1.1 });
k.add(k.stars(500));
const R = 2.7, JC = [0, -1.2, 0];
const J = k.add(jupiter(k, R), JC);
const n = new THREE.Vector3(-0.3, 0.2, 0.93).normalize();
const dirIn = new THREE.Vector3(-0.5, 0.5, 0.7).normalize();
const N = 21, T0 = 0.9, GAP = (D - 2.2) / N;
const frags = [], hits = [];
const r = k.rng;
for (let i = 0; i < N; i++) {
  const nn = n.clone().add(new THREE.Vector3((r() - 0.5) * 0.3, (r() - 0.5) * 0.3, (r() - 0.5) * 0.1)).normalize();
  const pt = nn.clone().multiplyScalar(R).add(new THREE.Vector3(...JC));
  const th = T0 + i * GAP;
  hits.push({ pt, th });
  frags.push(k.add(fragment(k, 0.22, 2)));
  k.burst(pt.toArray(), th, { count: 36, speed: 3.2, life: 1.1, size: 0.1, gravity: -1 });
  const scar = new THREE.Mesh(new THREE.CircleGeometry(0.28 + r() * 0.12, 20), new THREE.MeshBasicMaterial({ color: "#2a1608", transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthTest: false }));
  scar.position.copy(pt).addScaledVector(nn, 0.02); scar.lookAt(pt.clone().add(nn));
  k.add(scar); k.show(scar, th, Infinity, 0.3);
}
k.every((t) => {
  J.userData.ball.rotation.y = 0;
  frags.forEach((f, i) => {
    const h = hits[i], dt = h.th - t;
    f.visible = dt > 0 && dt < 3;
    f.position.copy(h.pt).addScaledVector(dirIn, dt * 6);
    f.lookAt(h.pt); f.rotateY(Math.PI / 2);
  });
  J.userData.atmo.material.opacity = 0.14 + 0.2 * Math.max(0, 1 - ((t - T0) % GAP) / 0.3) * (t > T0 ? 1 : 0);
});
k.flash(T0, 0.4);
k.shake(T0, D - 0.5, 0.05);
// Galileo, small, top right.
const gal = new THREE.Group();
gal.add(k.box({ size: [0.5, 0.5, 0.5], color: PALETTE.steel }));
const dish = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.3, 24, 1, true), k.toon(PALETTE.cream, { side: THREE.DoubleSide }));
dish.rotation.x = -Math.PI / 2; dish.position.z = 0.45; gal.add(dish);
k.add(gal, [3.4, 2.8, 0]);
k.every((t) => { gal.rotation.y = Math.sin(t * 0.8) * 0.5; gal.position.y = 2.8 + Math.sin(t * 1.2) * 0.1; });
const lg = k.add(k.label("GALILEO", { color: PALETTE.sky, size: 0.75 }), [3.4, 3.7, 0]);
k.show(lg, 1.6);
k.camera([[0, { pos: [2, 1.5, 15], look: [0, -0.5, 0] }], [D, { pos: [-1, 0.5, 11], look: [-1.3, -0.6, 0] }]]);
k.badge("1994", 0.15, "July 16 to 22");
k.done();
</script></body></html>
