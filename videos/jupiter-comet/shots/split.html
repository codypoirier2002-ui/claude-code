<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script></head><body><script type="module">
import { P } from "/scenes/common.js";
import { story, PALETTE, THREE, jupiter, fragment } from "/base/shots/jup.js";
const D = P.duration || 6;
const sky = ["#1a0b3d", "#05030f"];
// 1992: the comet passes close to Jupiter and is torn into pieces by gravity.
const k = await story({ fov: 62, sky, bloom: 0.9 });
k.add(k.stars(600));
const J = k.add(jupiter(k, 2.8), [0, -1.8, 0]);
k.every((t) => { J.userData.ball.rotation.y = t * 0.1; });
const ts = D * 0.42;
const nuc = k.add(fragment(k, 0.45, 2.4));
const frags = [];
for (let i = 0; i < 21; i++) frags.push(k.add(fragment(k, 0.16 + (i % 3) * 0.03, 1.3)));
const base = (t) => { const x = -9 + 3.4 * t; return new THREE.Vector3(x, 3.4 - 2.1 * Math.exp(-((x - 0.5) ** 2) / 14), 0.3); };
k.every((t) => {
  nuc.visible = t < ts; nuc.position.copy(base(t)); nuc.rotation.x = t * 2;
  const s = Math.max(0, t - ts);
  frags.forEach((f, i) => {
    f.visible = t >= ts;
    f.position.copy(base(t - i * 0.07 * Math.min(s, 1.6) * 2.2 + 0.02));
    f.position.y += Math.sin(i * 1.7) * 0.18 * Math.min(1, s);
    f.rotation.set(t * 2 + i, t, 0);
  });
});
const lab = k.add(k.label("TORN APART BY GRAVITY", { color: PALETTE.coral, size: 0.85 }), [0, 4.6, 0]);
k.show(lab, ts, Infinity);
k.flash(ts, 0.25);
k.shake(ts, ts + 0.5, 0.1);
k.burst([base(ts).x, base(ts).y, 0.3], ts, { count: 60, speed: 2.5, colors: ["#e8f6ff", "#8fe0ff", "#ffffff"], gravity: 0 });
k.camera([[0, { pos: [0, 1.5, 15], look: [0, 0.8, 0] }], [D, { pos: [1.2, 1.2, 12.5], look: [1, 0.6, 0] }]]);
k.badge("1992", 0.15, "Close pass to Jupiter");
k.done();
</script></body></html>
