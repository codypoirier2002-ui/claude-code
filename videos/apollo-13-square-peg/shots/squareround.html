<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
// Shot: the square CO2 filter vs the round hole (Apollo 13, 1970). PARAMS: duration, year, sub, badge (false to hide)
import { P } from '/scenes/common.js';
import { story, PALETTE, THREE } from '/scenes/story-kit.js';
const k = await story({ sky: ['#24398f', '#070a1f'], bloom: 0.8 });
k.add(k.stars(500));
// Round hole: coral ring with a dark opening.
const hole = new THREE.Group();
hole.add(new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.18, 20, 64), k.toon(PALETTE.coral)));
hole.add(new THREE.Mesh(new THREE.CircleGeometry(0.95, 48), new THREE.MeshBasicMaterial({ color: new THREE.Color('#0b0d24') })));
hole.children[1].position.z = -0.05;
k.add(hole, [0, 0.6, 0]);
k.every((t) => { hole.rotation.y = 0.35 * Math.sin(t * 0.8); hole.rotation.x = 0.12 * Math.sin(t * 0.6); });
// Square canister.
const can = k.box({ size: [1.6, 1.6, 0.7], color: PALETTE.mint, radius: 0.1 });
k.add(can, [-5, 0.6, 3]);
k.keys(can.position, [[0, [-5, 3.1, 3]], [1.1, [0, 0.6, 2.6]], [1.4, [0, 0.6, 0.7]], [1.5, [0, 0.6, 0.7]], [2.0, [0, 0.6, 2.2]], [3.2, [0.2, 0.6, 2.4]]]);
k.keys(can.rotation, [[0, [0.6, 0.9, 0.5]], [1.1, [0, 0, 0.5]], [1.45, [0, 0, 0.62]], [2.0, [0.2, -0.2, 0.15]], [3.2, [0, 0, 0.1]]]);
k.shake(1.4, 1.9, 0.14);
k.burst([0, 0.6, 0.6], 1.42, { count: 50, speed: 2.4, life: 0.8, size: 0.07 });
const ls = k.add(k.label('SQUARE', { color: PALETTE.mint, size: 0.5 }), [-1.0, 3.1, 2]);
const lr = k.add(k.label('ROUND', { color: PALETTE.coral, size: 0.5 }), [1.1, 2.45, 2]);
k.show(ls, 0.45); k.show(lr, 0.75);
k.camera([[0, { pos: [0, 1.5, 17], look: [0, 1.1, 0] }], [1.4, { pos: [0.2, 1.4, 12.5], look: [0, 1.0, 0] }], [4.5, { pos: [0.3, 1.3, 11.5], look: [0, 1.0, 0] }]]);
if (P.badge !== false) k.badge(P.year || '1970', 0.2, P.sub || 'Apollo 13');
k.done();
</script></body></html>
