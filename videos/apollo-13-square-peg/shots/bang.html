<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
// Shot: oxygen tank explosion, April 13, 1970, about 200,000 miles from Earth. PARAMS: duration, year, sub
import { P } from '/scenes/common.js';
import { story, PALETTE, THREE } from '/scenes/story-kit.js';
const D = P.duration || 8;
const k = await story({ sky: ['#10345a', '#04061a'], bloom: 0.9 });
k.add(k.stars(700));
const earth = k.add(k.planet({ color: PALETTE.earth, radius: 2.4, spots: 9, spotColor: '#58d68d' }), [-3.2, -0.6, -7]);
k.every((t) => { earth.userData.ball.rotation.y = t * 0.1; });
const moon = k.add(k.planet({ color: '#cfd3e0', radius: 0.8, spots: 8, spotColor: '#9aa0b5' }), [4.6, 4.2, -10]);
// Apollo stack: service module, command module (cone), lunar module on the nose.
const ship = new THREE.Group();
const sm = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.5, 28), k.toon(PALETTE.cream));
const bell = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.6, 20), k.toon('#8a93ab')); bell.rotation.x = Math.PI; bell.position.y = -1.0;
const band = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 0.18, 28), k.toon(PALETTE.sky)); band.position.y = 0.2;
const cm = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.8, 28), k.toon(PALETTE.sun)); cm.position.y = 1.15;
const lm = k.box({ size: [0.95, 0.8, 0.95], color: '#e9b44c', radius: 0.1 }); lm.position.y = 1.95;
const lmTop = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.42, 0.4, 8), k.toon('#cfd6e6')); lmTop.position.y = 2.55;
ship.add(sm, bell, band, cm, lm, lmTop);
for (const a of [0.8, 2.4, 3.9, 5.5]) { const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.9, 6), k.toon('#aab3c8')); leg.position.set(Math.cos(a) * 0.62, 1.55, Math.sin(a) * 0.62); leg.rotation.z = Math.cos(a) * 0.5; leg.rotation.x = -Math.sin(a) * 0.5; ship.add(leg); }
ship.scale.setScalar(0.85);
k.add(ship);
const hit = 4.4;
k.every((t) => {
  const u = t / D;
  ship.position.set(-0.8 + u * 2.6, 0.4 + u * 1.2, 0);
  const spin = t < hit ? 0 : (t - hit);
  ship.rotation.set(0.25 + spin * 0.25, spin * 0.5, -0.5 - spin * 0.5);
  // service module glows orange after the blast
  const heat = t < hit ? 0 : Math.max(0, 1 - (t - hit) / 2.5);
  sm.material.emissive = new THREE.Color('#ff5a1f'); sm.material.emissiveIntensity = heat * 2.2;
});
// Blast and the oxygen venting afterwards (pale puffs).
const at = [ship.position.x, 0.2, 0];
k.flash(hit, 0.5);
k.burst([-0.8 + (hit / D) * 2.6, 0.5 + (hit / D) * 1.2, 0], hit, { count: 170, speed: 3.2, life: 1.8, size: 0.13, gravity: 0 });
for (let i = 0; i < 5; i++) k.burst([-0.8 + ((hit + 0.2 + i * 0.5) / D) * 2.6 + 0.6, 0.5 + ((hit + 0.2 + i * 0.5) / D) * 1.2, 0.2], hit + 0.2 + i * 0.5, { count: 30, colors: ['#d9f3ff', '#ffffff', '#8fd3ff'], speed: 1.3, life: 1.6, size: 0.1, gravity: 0 });
k.shake(hit, hit + 0.8, 0.22);
const lbl = k.add(k.label('200,000 MILES AWAY', { color: PALETTE.sky, size: 0.34 }), [0.4, 3.3, 1]);
k.show(lbl, 0.7, hit - 0.1);
const lb2 = k.add(k.label('OXYGEN TANK EXPLODES', { color: PALETTE.coral, size: 0.3 }), [0.5, 3.3, 1]);
k.show(lb2, hit + 0.3);
k.camera([[0, { pos: [0, 0.6, 16], look: [0, 1.0, 0] }], [hit, { pos: [0.6, 0.9, 12], look: [0.4, 1.0, 0] }], [D, { pos: [0.8, 1.0, 11], look: [0.6, 1.0, 0] }]]);
k.badge(P.year || '1970', 0.2, P.sub || 'Apollo 13');
k.done();
</script></body></html>
