<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
// Shot: the lunar module Aquarius as a lifeboat: built for 2 men / 2 days, asked to keep 3 men alive ~4 days. PARAMS: duration
import { P } from '/scenes/common.js';
import { story, PALETTE, THREE } from '/scenes/story-kit.js';
const D = P.duration || 10;
const k = await story({ sky: ['#4a2a0a', '#0a0612'], bloom: 0.8 });
k.add(k.stars(500));
const moon = k.add(k.planet({ color: '#d9dbe6', radius: 1.3, spots: 9, spotColor: '#a4a8bd' }), [-3.6, 3.3, -9]);
// Lunar module.
const lm = new THREE.Group();
const base = k.box({ size: [2.3, 0.9, 2.3], color: '#e9b44c', radius: 0.14 }); base.position.y = 0;
const cabin = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.05, 1.2, 8), k.toon('#cfd6e6')); cabin.position.y = 1.0;
const win = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), k.toon(PALETTE.sky, { emissive: new THREE.Color(PALETTE.sky), emissiveIntensity: 0.6 })); win.position.set(0, 1.1, 0.95);
const dish = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.18, 16), k.toon('#ffffff')); dish.position.set(0.5, 1.8, 0); dish.rotation.z = 0.5;
lm.add(base, cabin, win, dish);
for (const [x, z] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.6, 8), k.toon('#aab3c8'));
  leg.position.set(x * 1.45, -0.8, z * 1.45); leg.rotation.z = -x * 0.5; leg.rotation.x = z * 0.5; lm.add(leg);
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.06, 16), k.toon('#aab3c8')); pad.position.set(x * 2.0, -1.55, z * 2.0); lm.add(pad);
}
lm.scale.setScalar(0.75);
k.add(lm, [0, 1.6, 0]);
k.every((t) => { lm.rotation.y = 0.5 + t * 0.25; lm.position.y = 1.7 + Math.sin(t * 1.3) * 0.08; });
// Crew: two astronauts early, a third pops in.
const crew = [];
[[-1.6, 1], [1.6, 1], [0, 2]].forEach(([x, i], idx) => {
  const f = k.figure({ color: ['#ff8fd8', '#4cc9f0', '#ffd166'][idx], scale: 0.7, helmet: true });
  k.add(f, [x, -0.3, 2.6]);
  crew.push(f);
});
k.show(crew[0], 0.8); k.show(crew[1], 1.2); k.show(crew[2], D * 0.42);
crew.forEach((f, i) => k.every((t) => { f.position.y = -0.3 + Math.sin(t * 1.6 + i) * 0.1; f.rotation.z = Math.sin(t * 1.1 + i) * 0.12; }));
const l1 = k.add(k.label('BUILT FOR 2 MEN / 2 DAYS', { color: PALETTE.sun, size: 0.4 }), [0, 3.7, 1]);
const l2 = k.add(k.label('NOW: 3 MEN / ~4 DAYS', { color: PALETTE.coral, size: 0.46 }), [0, 3.7, 1]);
k.show(l1, 0.5, D * 0.42 - 0.1); k.show(l2, D * 0.42);
k.flash(D * 0.42, 0.25);
k.camera([[0, { pos: [3, 3, 16], look: [0, 1.2, 0] }], [D, { pos: [-1.5, 2.2, 13.5], look: [0, 1.2, 0] }]]);
k.badge(P.year || '1970', 0.2, P.sub || 'Apollo 13');
k.done();
</script></body></html>
