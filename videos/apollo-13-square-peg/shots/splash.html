<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
// Shot: splashdown in the Pacific, April 17, 1970; all three astronauts home. PARAMS: duration
import { P } from '/scenes/common.js';
import { story, PALETTE, THREE } from '/scenes/story-kit.js';
const D = P.duration || 7;
const k = await story({ sky: ['#3d9bf0', '#bfe4ff'], bloom: 0.25, bloomThreshold: 0.97, fog: '#8fcdf5', exposure: 0.85, light: 1.7, saturation: 1.1 });
k.add(k.ground({ color: '#1a9bf0', size: 90 }), [0, 0, 0]);
const sun = new THREE.Mesh(new THREE.SphereGeometry(1.4, 24, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color('#fff2b0') })); k.add(sun, [6, 8, -40]);
[[-5, 6, -12], [4, 7.5, -16], [-1, 9, -22]].forEach(([x, y, z], i) => { const c = k.add(k.cloud({ scale: 1.6 }), [x, y, z]); k.every((t) => { c.position.x = x + Math.sin(t * 0.2 + i) * 0.6; }); });
// Recovery ship in the distance.
const ship = new THREE.Group();
ship.add(k.box({ size: [6, 0.7, 1.4], color: '#8a94a8', radius: 0.15 }));
const isl = k.box({ size: [0.9, 1.0, 0.8], color: '#b7c0d3', radius: 0.1 }); isl.position.set(1.4, 0.8, 0); ship.add(isl);
k.add(ship, [-6, 0.35, -14]);
// Capsule + three parachutes.
const cap = new THREE.Group(); cap.scale.setScalar(1.4);
const cone = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.8, 1.1, 24), k.toon('#e8ecf5')); cap.add(cone);
const shield = new THREE.Mesh(new THREE.SphereGeometry(0.8, 24, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2.4), k.toon('#7a4a2a')); shield.position.y = -0.55; cap.add(shield);
const chutes = new THREE.Group();
[[-1.5, 0], [0, 0.4], [1.5, 0]].forEach(([x, y], i) => {
  const dome = new THREE.Mesh(new THREE.SphereGeometry(1.15, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), k.toon(i === 1 ? '#ff9f1c' : '#ffffff', { side: THREE.DoubleSide }));
  dome.position.set(x, 3.4 + y, 0); chutes.add(dome);
  for (const a of [0, 1.6, 3.2, 4.8]) {
    const len = Math.hypot(Math.cos(a) * 1.0 - x * 0.0, 3.4 + y);
    const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 3.5, 4), new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffffff') }));
    cord.position.set(x / 2 + Math.cos(a) * 0.4, 1.7 + y / 2, Math.sin(a) * 0.4); cord.rotation.z = -Math.atan2(x - 0, 3.4) * 0.8; chutes.add(cord);
  }
});
cap.add(chutes);
k.add(cap);
const hitT = 3.4;
k.every((t) => {
  const u = Math.min(1, t / hitT);
  const e = 1 - Math.pow(1 - u, 1.3);
  cap.position.set(Math.sin(t * 0.9) * 0.35, 9 - 8.4 * e, 0);
  cap.rotation.z = t < hitT ? Math.sin(t * 1.1) * 0.12 : Math.sin(t * 2.2) * 0.06;
  chutes.visible = t < hitT + 0.05;
  if (t >= hitT) cap.position.y = 0.45 + Math.sin((t - hitT) * 2.4) * 0.06 * Math.exp(-(t - hitT) * 0.5);
});
// Splash.
k.burst([0.2, 0.3, 0], hitT, { count: 200, colors: ['#ffffff', '#bfe9ff', '#5ec8ff'], speed: 4.2, life: 1.5, size: 0.11, gravity: -7 });
const ripple = new THREE.Mesh(new THREE.TorusGeometry(1, 0.05, 8, 48), new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffffff'), transparent: true }));
ripple.rotation.x = Math.PI / 2; k.add(ripple, [0.2, 0.08, 0]);
k.every((t) => { const d = t - hitT; ripple.visible = d > 0 && d < 2; const s = 0.6 + Math.max(0, d) * 2.6; ripple.scale.set(s, s, s); ripple.material.opacity = Math.max(0, 1 - d / 2); });
k.flash(hitT, 0.3);
k.shake(hitT, hitT + 0.4, 0.1);
// Three crew, cheering.
const cols = ['#ff8fd8', '#4cc9f0', '#ffd166'];
[-0.95, 0, 0.95].forEach((x, i) => {
  const f = k.figure({ color: cols[i], scale: 0.5, helmet: false });
  k.add(f, [x, 1.3, 3.2]);
  k.show(f, hitT + 0.5 + i * 0.25);
  k.wave(f, hitT + 0.5 + i * 0.25, Infinity, 9 + i);
  k.every((t) => { f.position.y = 1.2 + Math.abs(Math.sin((t - hitT) * 5 + i)) * 0.18; });
});
const l1 = k.add(k.label('ALL 3 HOME', { color: '#ffffff', size: 0.5, bg: 'rgba(6,214,160,0.92)' }), [0, 3.1, 3.2]);
k.show(l1, hitT + 1.1);
const l0 = k.add(k.label('SPLASHDOWN, PACIFIC OCEAN', { color: PALETTE.ink, size: 0.34, bg: 'rgba(255,244,224,0.9)' }), [0, 4.9, 2]);
k.show(l0, 0.4, hitT - 0.2);
k.camera([[0, { pos: [0, 3, 15], look: [0, 4.5, 0] }], [hitT, { pos: [0, 2.0, 12], look: [0, 1.8, 0] }], [D, { pos: [0, 2.4, 10.5], look: [0, 2.6, 0] }]]);
k.badge(P.year || '1970', 0.2, P.sub || 'Apollo 13');
k.done();
</script></body></html>
