<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
import { P } from "/scenes/common.js";
import { story, PALETTE, THREE } from "/scenes/story-kit.js";
const D = P.duration || 6;
const k = await story({ sky: ["#1a1245", "#020108"], bloom: 0.9, frameY: 0.34 });
k.add(k.stars(900));
const dot = (r=0.5) => { const g = new THREE.Group(); g.add(new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color("#8fd0ff") }))); const h = new THREE.Mesh(new THREE.SphereGeometry(r*2.2, 24, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color("#4cc9f0"), transparent: true, opacity: 0.22 })); g.add(h); return g; };
const probe = () => { const g = new THREE.Group(); g.add(k.box({ size: [0.5,0.5,0.4], color: PALETTE.steel }));
 const dish = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 12, 0, Math.PI*2, 0, Math.PI/2.4), new THREE.MeshStandardMaterial({ color: "#fff4e0", side: THREE.DoubleSide })); dish.rotation.x = Math.PI/2; dish.position.z = 0.35; g.add(dish);
 const boom = k.box({ size: [1.4,0.06,0.06], color: PALETTE.sun }); boom.position.set(-0.9,0,-0.1); g.add(boom);
 const rtg = k.box({ size: [0.25,0.25,0.6], color: PALETTE.orange }); rtg.position.set(-1.6,0,-0.1); g.add(rtg); return g; };


const v = k.add(probe(), [5,-0.5,0]); v.rotation.y = -1.2; k.keys(v.position, [[0,[-1,2.3,0]],[D,[3.5,2.3,0]]]);
const sun = k.add(new THREE.Mesh(new THREE.SphereGeometry(0.9,32,24), new THREE.MeshBasicMaterial({ color: new THREE.Color("#ffd166").multiplyScalar(1.6) })), [-8.8,0.3,-3]);
const dots = []; for (let i=0;i<14;i++){ const m = k.add(new THREE.Mesh(new THREE.SphereGeometry(0.1,12,8), new THREE.MeshBasicMaterial({ color: "#ffd166" })), [-7.8+i*0.95, 0.3, -3]); k.show(m, 0.4+i*0.12); }
const lab = k.add(k.label("6 BILLION KM", { color: PALETTE.sun, size: 0.7 }), [-2,-1.0,-3]); k.show(lab, 1.2);
const e = k.add(dot(0.12), [-14.8,0.9,-3]); 
k.camera([[0,{pos:[-2,0.5,14],look:[-2,-0.3,0]}],[D,{pos:[-1.6,0.8,13],look:[-2,-0.3,0]}]]);
k.badge("1990", 0.15, "February 14");
k.done();
</script></body></html>
