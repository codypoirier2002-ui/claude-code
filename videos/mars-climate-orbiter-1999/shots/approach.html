<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
import { P } from "/scenes/common.js";
import { story, PALETTE, THREE } from "/scenes/story-kit.js";
const D = P.duration || 6;
function orbiter(k) {
  const g = new THREE.Group();
  const body = k.box({ size: [0.5, 0.5, 0.5], color: PALETTE.sun });
  g.add(body);
  for (const s of [-1, 1]) { const p = k.box({ size: [1.1, 0.04, 0.4], color: "#3a5bd9", radius: 0.01 }); p.position.x = s * 0.85; g.add(p); }
  const dish = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.14, 20), new THREE.MeshToonMaterial({ color: new THREE.Color(PALETTE.cream) }));
  dish.position.y = 0.34; g.add(dish);
  g.userData.body = body;
  return g;
}
const k = await story({ sky: ["#2b1055", "#05030f"], bloom: 0.9 });
k.add(k.stars(600));
const C = [0, -4, 0], R = 3;
const mars = k.add(k.planet({ color: PALETTE.mars, radius: R, spots: 12, spotColor: "#b23a1f" }), C);
const atmo = new THREE.Mesh(new THREE.SphereGeometry(R + 0.2, 48, 32), new THREE.MeshBasicMaterial({ color: new THREE.Color("#ff9f6b"), transparent: true, opacity: 0.18 }));
mars.add(atmo);
k.every((t) => { mars.userData.ball.rotation.y = t * 0.1; });
const pt = (r, a) => new THREE.Vector3(C[0] + Math.cos(a) * r, C[1] + Math.sin(a) * r, 0);
const arc = (fn) => new THREE.CatmullRomCurve3(Array.from({ length: 50 }, (_, i) => fn(i / 49)));
const planned = arc((u) => pt(4.6, 2.6 - 1.8 * u));
const safe = arc((u) => pt(3.7, 2.6 - 1.8 * u));
const actual = arc((u) => pt(4.6 - 1.35 * Math.min(1, u * 1.5), 2.6 - 1.8 * u));
const tube = (c, col, w = 0.04) => new THREE.Mesh(new THREE.TubeGeometry(c, 80, w, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(col) }));
k.show(k.add(tube(planned, PALETTE.mint)), 0.4);
k.show(k.add(tube(safe, PALETTE.sun, 0.025)), D * 0.55);
k.show(k.add(tube(actual, PALETTE.coral, 0.05)), D * 0.3);
const lp = k.add(k.label("PLAN 226 KM", { color: PALETTE.mint, size: 0.4 }), [pt(4.6, 2.2).x, pt(4.6, 2.2).y + 0.7, 0]); k.show(lp, 0.5);
const ls = k.add(k.label("SAFE 80 KM+", { color: PALETTE.sun, size: 0.36 }), [pt(3.7, 0.95).x + 0.4, pt(3.7, 0.95).y + 0.3, 0]); k.show(ls, D * 0.6);
const la = k.add(k.label("REAL 57 KM", { color: PALETTE.coral, size: 0.4 }), [0, pt(3.25, 1.7).y - 0.2, 0.5]); k.show(la, D * 0.4);
const craft = k.add(orbiter(k), [0, 0, 0]);
craft.scale.setScalar(0.8);
const end = D * 0.9;
k.every((t) => {
  const u = Math.min(1, Math.max(0, (t - 0.3) / (end - 0.3)));
  craft.position.copy(actual.getPoint(u));
  craft.rotation.set(t * 0.4, t * 0.9, 0.2);
  const heat = Math.max(0, (u - 0.8) / 0.2);
  craft.userData.body.material.emissive = new THREE.Color("#ff3b1f");
  craft.userData.body.material.emissiveIntensity = heat * 2;
  atmo.material.opacity = 0.18 + heat * 0.2;
});
k.camera([[0, { pos: [0, 0.5, 16], look: [0, -0.8, 0] }], [D, { pos: [0.5, 0.2, 13], look: [0, -1.2, 0] }]]);
k.done();
</script></body></html>
