<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
import { P } from "/scenes/common.js";
import { story, PALETTE, THREE } from "/scenes/story-kit.js";
const D = P.duration || 6;
function orbiter(k) {
  const g = new THREE.Group();
  const body = k.box({ size: [0.5, 0.5, 0.5], color: PALETTE.sun });
  g.add(body);
  for (const s of [-1, 1]) { const p = k.box({ size: [1.1, 0.04, 0.4], color: "#3a5bd9", radius: 0.01 }); p.position.x = s * 0.85; g.add(p); }
  const dish = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.14, 20), new THREE.MeshToonMaterial({ color: new THREE.Color(PALETTE.cream) }));
  dish.position.y = 0.34; g.add(dish);
  g.userData.body = body;
  return g;
}
const k = await story({ sky: ["#3a0f2a", "#05030f"], bloom: 1.0 });
k.add(k.stars(500));
const C = [0, -5, 0], R = 4;
const mars = k.add(k.planet({ color: PALETTE.mars, radius: R, spots: 12, spotColor: "#b23a1f" }), C);
const atmo = new THREE.Mesh(new THREE.SphereGeometry(R + 0.3, 48, 32), new THREE.MeshBasicMaterial({ color: new THREE.Color("#ff9f6b"), transparent: true, opacity: 0.2 }));
mars.add(atmo);
const craft = k.add(orbiter(k), [0, 0, 0]);
const hit = D * 0.5;
const from = new THREE.Vector3(-6, 1.2, 0), to = new THREE.Vector3(0.2, C[1] + R + 0.2, 0);
k.every((t) => {
  const u = Math.min(1, Math.max(0, t / hit));
  craft.position.lerpVectors(from, to, u * u * 0.4 + u * 0.6);
  craft.rotation.set(t * 1.3, t * 2.1, 0.3);
  craft.visible = t < hit;
  const heat = Math.max(0, (u - 0.55) / 0.45);
  craft.userData.body.material.emissive = new THREE.Color("#ff3b1f");
  craft.userData.body.material.emissiveIntensity = heat * 3;
  atmo.material.opacity = 0.2 + heat * 0.3;
});
k.flash(hit);
k.burst(to.toArray(), hit, { count: 160, speed: 3, colors: [PALETTE.sun, PALETTE.coral, PALETTE.orange, "#ffffff"] });
k.shake(hit, hit + 0.7, 0.14);
const l1 = k.add(k.label("SIGNAL LOST", { color: PALETTE.coral, size: 0.7 }), [0, 4.6, 1]); k.show(l1, hit + 0.3);
const l2 = k.add(k.label("49 SEC EARLY", { color: PALETTE.sun, size: 0.5 }), [0, 3.4, 1]); k.show(l2, hit + 0.9);
k.camera([[0, { pos: [0, 2.5, 16], look: [0, -0.5, 0] }], [hit, { pos: [0.8, 0.8, 12], look: [0.2, -1, 0] }], [D, { pos: [0.9, 0.9, 11], look: [0.2, -1, 0] }]]);
k.done();
</script></body></html>
