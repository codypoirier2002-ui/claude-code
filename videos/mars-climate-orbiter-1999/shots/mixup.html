<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
import { P } from "/scenes/common.js";
import { story, PALETTE, THREE } from "/scenes/story-kit.js";
const D = P.duration || 6;
const k = await story({ sky: ["#1b1f3b", "#07091a"], bloom: 0.8 });
k.add(k.stars(300));
const left = k.add(k.box({ size: [1.8, 1.4, 1.0], color: PALETTE.coral }), [-2.1, 1.2, 0]);
const right = k.add(k.box({ size: [1.8, 1.4, 1.0], color: PALETTE.sky }), [2.1, 1.2, 0]);
k.show(left, 0.1); k.show(right, 0.3);
const lg = k.add(k.label("GROUND", { color: PALETTE.cream, size: 0.38 }), [-2.1, 2.5, 0]); k.show(lg, 0.4);
const rg = k.add(k.label("CRAFT", { color: PALETTE.cream, size: 0.38 }), [2.1, 2.5, 0]); k.show(rg, 0.5);
const lu = k.add(k.label("POUNDS", { color: PALETTE.coral, size: 0.38 }), [-2.1, 0.2, 0]); k.show(lu, D * 0.18);
const ru = k.add(k.label("NEWTONS", { color: PALETTE.sky, size: 0.38 }), [2.1, 0.2, 0]); k.show(ru, D * 0.3);
// A data pulse travels from the ground box to the craft box; the mismatch shows as a flash and a x4.45 label.
const pulse = k.add(new THREE.Mesh(new THREE.SphereGeometry(0.25, 20, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(PALETTE.sun) })), [-0.8, 1.2, 0.8]);
const t0 = D * 0.45, t1 = D * 0.7;
k.every((t) => {
  const u = Math.min(1, Math.max(0, (t - t0) / (t1 - t0)));
  pulse.position.x = -0.8 + 1.6 * u;
  pulse.visible = t >= t0 && t < t1 + 0.4;
  const s = 1 + (u >= 1 ? Math.min(1.2, (t - t1) * 3) : 0);
  pulse.scale.setScalar(s);
  pulse.material.color.set(u >= 1 ? PALETTE.coral : PALETTE.sun);
});
k.flash(t1);
k.burst([0.8, 1.2, 0.8], t1, { count: 90, speed: 2.5, colors: [PALETTE.coral, PALETTE.sun, "#ffffff"] });
k.shake(t1, t1 + 0.5, 0.1);
const x = k.add(k.label("x4.45", { color: PALETTE.sun, size: 0.8 }), [0, -1.2, 1]); k.show(x, t1);
const lb = k.add(k.label("1 lbf = 4.45 N", { color: PALETTE.cream, size: 0.36 }), [0, -2.4, 1]); k.show(lb, t1 + 0.6);
k.camera([[0, { pos: [0, 1.4, 17], look: [0, 0.8, 0] }], [D, { pos: [0, 1.0, 14.5], look: [0, 0.6, 0] }]]);
k.done();
</script></body></html>
