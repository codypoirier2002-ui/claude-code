<!doctype html><html><head><meta charset="utf-8"><title>juice</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
// Reenactment shot: Fleming and the moldy dish (1928). Artist's reenactment, stylized.
import { P, rng } from '/scenes/common.js';
import { story, PALETTE, THREE } from '/scenes/story-kit.js';
const D = P.duration || 6;
const R = rng(P.seed || 7);

const k = await story({ sky: ['#0b6e4f', '#3b0a45'], bloom: 0.4 });
k.add(k.stars(250));
const germ=(c)=>{const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.SphereGeometry(0.5,20,14),MAT(c)));for(let i=0;i<10;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.3,8),MAT(c));const a=Math.acos(1-2*(i+0.5)/10),b=Math.PI*(1+Math.sqrt(5))*(i+0.5);s.position.set(Math.sin(a)*Math.cos(b),Math.cos(a),Math.sin(a)*Math.sin(b)).multiplyScalar(0.55);s.lookAt(s.position.clone().multiplyScalar(2));s.rotateX(Math.PI/2);g.add(s);}
 for(const x of [-0.16,0.16]){const e=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),MAT('#ffffff'));e.position.set(x,0.1,0.45);g.add(e);const p=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,6),MAT('#1b1f3b'));p.position.set(x,0.1,0.51);g.add(p);}return g;};
const MAT=(c,o={})=>new THREE.MeshToonMaterial({color:new THREE.Color(c),...o});
const mold=k.add(new THREE.Mesh(new THREE.SphereGeometry(0.8,24,16),MAT('#8fd0a8',{emissive:new THREE.Color('#2f7a5a'),emissiveIntensity:0.4})),[0,4.3,0]);
mold.scale.y=0.7;
const drop=k.add(new THREE.Mesh(new THREE.SphereGeometry(0.22,16,12),new THREE.MeshBasicMaterial({color:new THREE.Color('#b8ff9a')})),[0,3.4,0]);
const names=[['STREP','#ff5d73',-2.4],['MENINGOCOCCUS','#ffd166',0],['DIPHTHERIA','#4cc9f0',2.4]];
const hits=[1.4,2.7,4.0];
names.forEach(([n,c,x],i)=>{const g=k.add(germ(c),[x,0.3,0]);g.scale.setScalar(0.8);
  k.every(t=>{g.position.y=0.3+Math.sin(t*3+i)*0.1;g.rotation.y=t*0.8;g.visible=t<hits[i];});
  const lb=k.add(k.label(n,{color:c,size:n.length>8?0.3:0.38}),[x,-1.0,0.6]);k.show(lb,0.3,hits[i]+0.5);
  k.burst([x,0.3,0],hits[i],{count:60,speed:2.2});k.flash(hits[i]);});
k.every(t=>{const idx=hits.findIndex(h=>t<h);const tgt=idx<0?hits.length-1:idx;
 const tx=names[tgt][2];const prev=idx<=0?-0.0:hits[idx-1];
 const start=idx<=0?0.3:prev; const u=Math.max(0,Math.min(1,(t-start)/((idx<0?hits[2]:hits[idx])-start)));
 const fromX=idx<=0?0:names[idx-1][2];
 drop.position.set(fromX+(tx-fromX)*u,3.6-(3.6-0.4)*u*u-Math.sin(u*Math.PI)*-1.0,0);drop.visible=t<hits[2];mold.scale.set(1+0.05*Math.sin(t*6),0.7,1);});
const lm=k.add(k.label('MOLD JUICE',{color:PALETTE.mint,size:0.45}),[0,5.4,0]);k.show(lm,0.1);
k.shake(1.4,1.7,0.08);k.shake(2.7,3.0,0.08);k.shake(4.0,4.4,0.1);
k.camera([[0,{pos:[0,2.5,17],look:[0,-0.3,0]}],[D,{pos:[0,2.3,15],look:[0,-0.2,0]}]]);
k.badge('1928',0.1,'Penicillium notatum');
k.done();
</script></body></html>
