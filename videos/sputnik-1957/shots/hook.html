<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
import { P } from "/scenes/common.js";
import { story, PALETTE, THREE } from "/scenes/story-kit.js";
const D = P.duration || 6;
function sputnik(k, s = 1) {
  const g = new THREE.Group();
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.6, 40, 28), new THREE.MeshToonMaterial({ color: new THREE.Color("#9fb0cc"), emissive: new THREE.Color("#3a4f8f"), emissiveIntensity: 0.15 }));
  g.add(ball);
  for (const [ry, rz] of [[0, 1], [Math.PI / 2, 1], [Math.PI, 1], [-Math.PI / 2, 1]]) {
    const a = new THREE.Group();
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 2.6, 8), new THREE.MeshToonMaterial({ color: new THREE.Color("#f2f5fb") }));
    rod.position.y = 1.3; a.add(rod); a.rotation.y = ry; a.rotation.z = -1.25; a.position.y = 0.0; g.add(a);
  }
  g.scale.setScalar(s); return g;
}
function beepRings(k, parent, t0, t1, color = "#ffd166", max = 4.5) {
  const rings = [];
  for (let i = 0; i < 3; i++) { const m = new THREE.Mesh(new THREE.TorusGeometry(1, 0.035, 8, 64), new THREE.MeshBasicMaterial({ color: new THREE.Color(color), transparent: true })); parent.add(m); rings.push(m); }
  k.every((t) => rings.forEach((m, i) => { const on = t >= t0 && t <= t1; const u = ((t - t0) * 0.9 + i / 3) % 1; m.visible = on; m.scale.setScalar(0.8 + u * max); m.material.opacity = (1 - u) * 0.9; m.lookAt(k.camera_pos || new THREE.Vector3(0, 0, 50)); }));
}

const k = await story({ sky: ["#1b2a6b", "#05030f"], bloom: 0.45, bloomThreshold: 0.92 });
k.add(k.stars(900));
const s = k.add(sputnik(k, 1.3), [0, 0, 0]);
k.every((t) => { s.rotation.set(0.35, t * 0.9, 0.2 + Math.sin(t * 2) * 0.05); });
const rg = new THREE.Group(); k.add(rg, [0, 0, 0]);
beepRings(k, rg, 0.35, D);
const lb = k.add(k.label("BEEP!", { color: "#ffd166", size: 0.9 }), [1.9, 1.7, 0]); k.show(lb, 0.35, D);
const lb2 = k.add(k.label("BEEP!", { color: "#ff7ab6", size: 0.7 }), [-2.0, -1.5, 0]); k.show(lb2, 1.1, D);
k.flash(0.35);
k.camera([[0, { pos: [0, 0.5, 13], look: [0, 0, 0] }], [D, { pos: [1, 0.3, 8], look: [0, 0, 0] }]]);
k.badge("1957", 0.2, "Sputnik 1");
k.done();
</script></body></html>
