<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
import { P } from '/scenes/common.js';
import { story, PALETTE, THREE } from '/scenes/story-kit.js';
const D = P.duration || 6;
const k = await story({ sky: ['#ff8a5c', '#3a1d6e'], bloom: 0.2, bloomThreshold: 0.97, light: 1.6, vignette: 0.35, fov: 50 });
k.add(k.ground({ color: '#a8683a', size: 80 }), [0, -1, 0]);
for (let i = 0; i < 5; i++) k.add(k.cloud({ scale: 1.6 }), [-14 + i * 7, 6 + (i % 2) * 2, -14]);
// Stylized 1903 Flyer: two stacked wings, front elevator, rear rudder, skids, spinning propeller. Faces +x.
function flyer(color = '#fff1d6') {
  const g = new THREE.Group();
  for (const y of [0.28, -0.28]) { const w = k.box({ size: [0.9, 0.04, 3.6], color, radius: 0.02 }); w.position.y = y; g.add(w); }
  for (const z of [-1.5, 0, 1.5]) for (const x of [-0.35, 0.35]) { const s = k.box({ size: [0.04, 0.56, 0.04], color: '#7a5230', radius: 0.01 }); s.position.set(x, 0, z); g.add(s); }
  const el = k.box({ size: [0.45, 0.03, 1.6], color }); el.position.set(1.4, 0.05, 0); g.add(el);
  const ru = k.box({ size: [0.4, 0.03, 1.2], color }); ru.position.set(-1.6, 0, 0); g.add(ru);
  const sk = k.box({ size: [2.6, 0.04, 0.05], color: '#7a5230', radius: 0.01 }); sk.position.set(0.3, -0.55, 0.5); g.add(sk);
  const sk2 = sk.clone(); sk2.position.z = -0.5; g.add(sk2);
  const eng = k.box({ size: [0.35, 0.25, 0.4], color: PALETTE.ink }); eng.position.set(-0.2, -0.1, 0.45); g.add(eng);
  const prop = k.box({ size: [0.04, 0.12, 1.1], color: PALETTE.orange, radius: 0.01 }); prop.position.set(-0.55, 0, 0.45); g.add(prop);
  g.userData.prop = prop; return g;
}
const spin = (f, t0 = 0) => k.every((t) => { f.userData.prop.rotation.x = t * 60; });

const f = k.add(flyer(), [0, -0.4, 0]); spin(f);
f.rotation.y = -0.5;
const a = k.add(k.figure({ color: PALETTE.coral, scale: 1.1 }), [-2.4, -1, 1.5]);
const b = k.add(k.figure({ color: PALETTE.violet, scale: 1.1 }), [-1.4, -1, 2.2]);
a.rotation.y = 0.6; b.rotation.y = 0.4;
k.wave(a, 3.2, 5, 9); k.wave(b, 3.6, 5.4, 9);
const l1 = k.add(k.label('ORVILLE', { color: PALETTE.coral, size: 0.5 }), [-2.4, 1.3, 1.5]); k.show(l1, 2.2);
const l2 = k.add(k.label('WILBUR', { color: PALETTE.pink, size: 0.5 }), [-1.2, 1.9, 2.2]); k.show(l2, 2.7);
const l3 = k.add(k.label('THE FLYER', { color: PALETTE.sun, size: 0.5 }), [1.4, 1.6, 0]); k.show(l3, 4.0);
k.camera([[0, { pos: [2, 1.8, 15], look: [-0.5, 0.4, 0] }], [D, { pos: [-0.5, 1.4, 12], look: [-0.5, 0.5, 0.5] }]]);
k.badge('1903', 0.15, 'Dec. 17 \u00b7 Kitty Hawk, N.C.');
k.done();
</script></body></html>
