// Tacoma Narrows 1940 reenactment shot (twist). Artist's reenactment: stylized, not to scale.
import { P } from '/scenes/common.js';
import { story, PALETTE, THREE } from '/scenes/story-kit.js';
import { makeBridge } from './bridge.js';
const D = P.duration || 6;
const ramp = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const k = await story({ sky: ['#4a5688', '#1c2040'], bloom: 0.7, bloomThreshold: 0.95, fog: '#2a3060' });
k.add(k.cloud({ color: '#8d98c4', scale: 2.6 }), [-6, 11, -14]); k.add(k.cloud({ color: '#8d98c4', scale: 2 }), [8, 9, -12]);
makeBridge(k, { bounce: (t) => 0.5 * (1 - ramp(t, 0.1, 0.4 * D)), twist: (t) => 0.05 + 0.5 * ramp(t, 0.2, D * 0.95), windAmt: () => 1.2, wind: 55 });
k.camera([[0, { pos: [-22, 5, 12], look: [2, 1.5, 0] }], [D, { pos: [-17, 3, 7.5], look: [2.5, 1.5, 0] }]]);
k.badge('NOV 7', 0.2, '1940');
k.done();
</script></body></html>
