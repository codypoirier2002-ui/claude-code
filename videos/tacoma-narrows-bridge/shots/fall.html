<!doctype html><html><head><meta charset="utf-8"><title>fall</title>
<script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
</head><body><script type="module">
// Tacoma Narrows 1940 reenactment shot (fall). Artist's reenactment: stylized, not to scale.
import { P } from '/scenes/common.js';
import { story, PALETTE, THREE } from '/scenes/story-kit.js';
import { makeBridge } from './bridge.js';
const D = P.duration || 6;
const ramp = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const k = await story({ sky: ['#4a5688', '#1c2040'], bloom: 0.9, bloomThreshold: 0.95, fog: '#2a3060' });
k.add(k.cloud({ color: '#8d98c4', scale: 2.6 }), [-6, 11, -14]);
const hit = D * 0.45;
makeBridge(k, { twist: (t) => 0.5 + 0.35 * ramp(t, 0, hit), windAmt: () => 1.2, wind: 45, fall: { t0: hit } });
k.flash(hit, 0.4); k.shake(hit, hit + 1.4, 0.2);
k.burst([0, -6.5, 0], hit + 0.9, { count: 160, colors: ['#ffffff', PALETTE.sky, '#9fe3ff'], speed: 5, life: 1.8, size: 0.14, gravity: -6 });
k.burst([-2, -6.5, 0.5], hit + 0.7, { count: 100, colors: ['#ffffff', PALETTE.sky], speed: 4, life: 1.6, size: 0.12, gravity: -6 });
k.camera([[0, { pos: [-17, 3, 7.5], look: [2.5, 1.2, 0] }], [hit, { pos: [-16, 2.8, 7.5], look: [2.5, 1.2, 0] }], [D, { pos: [-22, 0.5, 15], look: [1, -2.5, 0] }]]);
k.badge('1940', 0.2, 'Collapse');
k.done();
</script></body></html>
