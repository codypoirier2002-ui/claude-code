</head><body><script type="module">
// Tacoma Narrows 1940 reenactment shot (gertie). Artist's reenactment: stylized, not to scale.
import { P } from '/scenes/common.js';
import { story, PALETTE, THREE } from '/scenes/story-kit.js';
import { makeBridge } from './bridge.js';
const D = P.duration || 6;
const ramp = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const k = await story({ sky: ['#9bb8d9', '#f3d9b8'], bloom: 0.7, bloomThreshold: 0.95 });
k.add(k.cloud({ color: '#e6ecf7', scale: 2.4 }), [-5, 10, -15]);
makeBridge(k, { bounce: (t) => 0.15 + 0.5 * ramp(t, 0, D * 0.5), windAmt: (t) => ramp(t, 0, 0.5), wind: 45 });
k.camera([[0, { pos: [-22, 2.2, 10], look: [2, 1.3, 0] }], [D, { pos: [-19, 2.0, 8.5], look: [3, 1.3, 0] }]]);
const l = k.add(k.label('GALLOPING GERTIE', { color: PALETTE.sun, size: 0.7 }), [0, 6.8, 0]); k.show(l, 0.6);
k.badge('1940', 0.2, 'Deck bounces in the wind');
k.done();
</script></body></html>
