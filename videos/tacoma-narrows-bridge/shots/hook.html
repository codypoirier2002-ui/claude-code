// Tacoma Narrows 1940 reenactment shot (hook). Artist's reenactment: stylized, not to scale.
import { P } from '/scenes/common.js';
import { story, PALETTE, THREE } from '/scenes/story-kit.js';
import { makeBridge } from './bridge.js';
const D = P.duration || 6;
const ramp = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const k = await story({ sky: ['#6e7fa8', '#2a2f55'], bloom: 0.7, bloomThreshold: 0.95, fog: '#3a4170' });
k.add(k.cloud({ color: '#c9d2ee', scale: 2.2 }), [-6, 11, -14]); k.add(k.cloud({ color: '#c9d2ee', scale: 1.8 }), [8, 9, -16]);
makeBridge(k, { twist: (t) => 0.2 + 0.45 * ramp(t, 0, D * 0.8), windAmt: () => 1, wind: 50 });
k.flash(0.05, 0.25);
k.camera([[0, { pos: [-21, 3.2, 10], look: [3, 1.6, 0] }], [D, { pos: [-19, 3.6, 8.5], look: [3, 1.8, 0] }]]);
k.badge('1940', 0.2, 'Tacoma Narrows Bridge');
k.done();
</script></body></html>
